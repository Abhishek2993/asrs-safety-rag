[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asrs-safety-rag"
version = "0.1.0"
description = "Retrieval-augmented analysis of NASA ASRS aviation incident reports: similar-incident search, contributing-factor classification and cited trend summaries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Abhishek Maurya" }]
keywords = ["aviation-safety", "asrs", "rag", "retrieval", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Runtime dependencies are pinned to the versions the published results were produced with.
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "faiss-cpu==1.16.0",
    "scipy==1.17.1",
    "sentence-transformers==6.3.0",
    "requests==2.34.2",
    "streamlit==1.67.0",
    "altair==6.3.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]
screenshots = [
    "playwright==1.65.2",
]

[project.scripts]
asrs-rag = "asrs_rag.cli:main"

[project.urls]
Repository = "https://github.com/Abhishek2993/asrs-safety-rag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
